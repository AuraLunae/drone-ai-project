[project]
name = "drone-ai-project"
version = "0.1.0"
description = "PyBullet -> Unity ML-Agents ドローンRLパイプライン(フルエンドツーエンド版)"
requires-python = ">=3.10.1,<=3.10.12"

dependencies = [
    "gymnasium==0.29.1",
    "pybullet==3.2.6",
    "stable-baselines3==2.2.1",
    "mlagents-envs==1.1.0",
    "gym==0.26.2",
    "shimmy>=0.2.1",
    "numpy<2.0.0",
    "torch",
    "tensorboard",
]

[tool.uv]
only-binary = ["pybullet"]